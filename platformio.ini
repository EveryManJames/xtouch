; PlatformIO Project Configuration File
;
; Two hardware targets share the [env] base below:
;   env:esp32dev     -> 2.8" ESP32-2432S028R  (ILI9341 SPI + XPT2046 resistive touch)
;   env:jc8048w550   -> 5"   Guition JC8048W550 (ESP32-S3, ST7262 RGB + GT911 capacitive)
;
; The platform is pinned to 6.5.0 (arduino-esp32 2.0.14) because Arduino_GFX's
; Arduino_ESP32RGBPanel only compiles against arduino-esp32 2.x. TFT_eSPI works on
; 2.x as well, so both targets share the pinned platform for reproducibility.
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    scripts/pre-build.py
    scripts/post-build.py
lib_deps =
    lvgl/lvgl@8.3.9
    https://github.com/knolleary/pubsubclient.git
    ArduinoJson@6.21.5
    FS
    SD
    https://github.com/PaulStoffregen/OneWire.git
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

; ---------------------------------------------------------------------------
; 2.8" ESP32-2432S028R (original hardware) - unchanged behaviour
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
    -D__XTOUCH_SCREEN_28__
    !python3 scripts/version.py
lib_deps =
    ${env.lib_deps}
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_src_filter =
    +<*>
    -<devices/5.0/>
    -<ui5/>

; ---------------------------------------------------------------------------
; 5" Guition JC8048W550 (ESP32-S3-WROOM-1 N16R8: 16MB flash, 8MB OPI PSRAM)
; ---------------------------------------------------------------------------
[env:jc8048w550]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
build_flags =
    -D__XTOUCH_SCREEN_5__
    -DBOARD_HAS_PSRAM
    !python3 scripts/version.py
lib_deps =
    ${env.lib_deps}
    https://github.com/moononournation/Arduino_GFX.git#v1.6.7
    https://github.com/TAMCTec/gt911-arduino.git
    https://github.com/adafruit/Adafruit_NeoPixel.git
build_src_filter =
    +<*>
    -<devices/2.8/>
    -<ui/>
